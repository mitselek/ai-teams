# teams-migration-probe -- THROWAWAY 2.1.178+ probe container (*FR:Brunel*)
#
# Usage (on the rc host):
#   DOCKER_BUILDKIT=1 docker compose -f docker-compose.probe.yml build
#   docker compose -f docker-compose.probe.yml up -d
#   docker compose -f docker-compose.probe.yml exec teams-migration-probe bash
#   docker compose -f docker-compose.probe.yml down -v        # THROWAWAY: deletes the volume
#
# AUTH = option (c), PO decision 2026-06-17 18:23: FRESH `claude login` INSIDE the probe,
# driven interactively over tmux at runtime (NOT an API key, NOT a copy of apex's creds).
# The probe's ~/.claude starts EMPTY; the login writes its OWN ~/.claude/.credentials.json
# there -- isolated token, apex's live OAuth seat untouched. No credential env/mount here.
# The OAuth device-code flow needs egress to console.anthropic.com / claude.ai (not just
# api.anthropic.com) -- see the WARP/host-net note below.
#
# Isolated: own named volume, own SSH port (2229 to avoid clashing with live 2222-2228),
# host networking only if WARP requires it (default bridge here -- simplest for a throwaway;
# switch to network_mode: host + the WARP CA mount if egress needs the tunnel).

services:
  teams-migration-probe:
    build:
      context: .
      dockerfile: Dockerfile.probe
      network: host
    image: teams-migration-probe:2.1.179
    container_name: teams-migration-probe
    hostname: teams-migration-probe
    # Bridge net + published SSH on 2229 (operator drives via tmux over SSH).
    # If the rc host's egress to api.anthropic.com requires WARP, switch to
    # network_mode: host and mount the WARP CA (see commented block below).
    ports:
      - "2229:2222"
    environment:
      - HOME=/home/ai-teams
      - CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1
      # NO credential env -- auth is a runtime `claude login` (option c). Deliberately absent.
      # Operator SSH pubkey for the tmux drive (set in rc-host env before `up`).
      - SSH_PUBLIC_KEY=${PROBE_SSH_PUBLIC_KEY:-}
      # WARP TLS CA for Node egress (only needed on the WARP host).
      - NODE_EXTRA_CA_CERTS=${PROBE_NODE_EXTRA_CA_CERTS:-}
    # --- WARP host variant (uncomment if egress needs the tunnel) ---
    # The OAuth login flow must reach console.anthropic.com / claude.ai, not just
    # api.anthropic.com -- on the WARP host that means the tunnel + the WARP CA.
    # The CA mount is HOST_SOURCE:CONTAINER_TARGET. Source = the real host CA file
    # (apex uses /usr/local/share/ca-certificates/managed-warp.pem, a SYMLINK ->
    # /etc/ssl/certs/managed-warp.pem ~1139B; either resolves). Target = /opt/warp-ca.pem
    # INSIDE the container -- this path does NOT pre-exist on the host; the mount creates it.
    # NODE_EXTRA_CA_CERTS points at the in-container TARGET, not the host source.
    # IMPORTANT: only set PROBE_NODE_EXTRA_CA_CERTS=/opt/warp-ca.pem IF this mount is
    # uncommented -- otherwise NODE points at a path that doesn't exist in the container.
    # network_mode: host
    # volumes:
    #   - /usr/local/share/ca-certificates/managed-warp.pem:/opt/warp-ca.pem:ro
    # and set PROBE_NODE_EXTRA_CA_CERTS=/opt/warp-ca.pem
    volumes:
      # THROWAWAY claude state -- the probes' filesystem observation surface.
      # down -v deletes it. Lets the operator docker cp snapshots out for the record.
      - probe-claude-home:/home/ai-teams/.claude
    stdin_open: true
    tty: true
    restart: "no"   # throwaway -- do NOT auto-restart

volumes:
  probe-claude-home:
    name: teams-migration-probe_claude-home
